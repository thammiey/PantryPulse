name: Build, test & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its Android SDK jar from Maven Central the first time tests run.
      # Cache it, and retry once, so a flaky download doesn't block the release.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit & UI tests
        # Non-blocking for now so a flaky test download can't stop the APK being published.
        # A failed test shows as a warning on the run; set this to false to make tests block releases again.
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest || {
            echo "Tests failed, retrying once in case the Robolectric download was flaky..."
            sleep 20
            ./gradlew :app:testDebugUnitTest
          }

      # Optional but recommended: sign every build with YOUR key so each new APK installs over the
      # previous one. Add these repository secrets (Settings > Secrets and variables > Actions):
      #   PANTRYPULSE_KEYSTORE_BASE64, PANTRYPULSE_KEYSTORE_PASSWORD, PANTRYPULSE_KEY_ALIAS, PANTRYPULSE_KEY_PASSWORD
      # Without them the build falls back to a throw-away debug key (a different one on every run).
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.PANTRYPULSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PANTRYPULSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PANTRYPULSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PANTRYPULSE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pantrypulse.jks"
            echo "PANTRYPULSE_KEYSTORE=$RUNNER_TEMP/pantrypulse.jks" >> "$GITHUB_ENV"
            echo "PANTRYPULSE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PANTRYPULSE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PANTRYPULSE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set; using the debug key."
          fi

      - name: Build APK and App Bundle
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/PantryPulse.apk
          cp app/build/outputs/bundle/release/app-release.aab out/PantryPulse.aab

      - uses: actions/upload-artifact@v4
        with:
          name: PantryPulse
          path: out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots

      # Publishes (or refreshes) the v1.0.0 release so these links always serve the latest build:
      #   https://github.com/<owner>/<repo>/releases/latest/download/PantryPulse.apk
      #   https://github.com/<owner>/<repo>/releases/latest/download/PantryPulse.aab
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/PantryPulse.apk out/PantryPulse.aab --clobber
          else
            gh release create "$TAG" out/PantryPulse.apk out/PantryPulse.aab \
              --title "PantryPulse $TAG" --latest \
              --notes "PantryPulse.apk — install directly on Android 8.0+. PantryPulse.aab — upload to Google Play Console."
          fi
